    // Bilingual i18n Dictionary
    var i18n = {
      zh: {
        title: '找不到网页',
        h1: '找不到网页',
        descPrefix: '请求的页面',
        descSuffix: '未在我们的服务器上检索到。',
        descNote: '这便是我们所知道的全部信息。',
        solutionsHeading: '以下是一些可能的解决方案：',
        solutions: [
          '稍后重新加载此页面。',
          '在以下位置查找此页面的存档副本：<a href="https://web.archive.org/" target="_blank" style="color: #1a73e8; color: var(--link-color); text-decoration: none;">web.archive.org</a>。',
          '与带您到这里的人核实此页面上的地址是否正确。',
          '使用搜索引擎搜索您正在寻找的关键字。'
        ],
        homeBtn: '返回首页',
        snackbarPrefix: '...但是你知道吗？',
        snackbarAction: '啊？'
      },
      en: {
        title: 'Page not found',
        h1: 'Page not found',
        descPrefix: 'The requested URL',
        descSuffix: 'was not found on this server.',
        descNote: 'That’s all we know.',
        solutionsHeading: 'Here are some possible solutions:',
        solutions: [
          'Reload this page later.',
          'Find an archived copy of this page at: <a href="https://web.archive.org/" target="_blank" style="color: #1a73e8; color: var(--link-color); text-decoration: none;">web.archive.org</a>.',
          'Check with the person who sent you here to see if the address is correct.',
          'Search for keywords using a search engine.'
        ],
        homeBtn: 'Back to Home',
        snackbarPrefix: '...But did you know?',
        snackbarAction: 'Wait, what?'
      }
    };

    // Determine Language: prioritize URL query params ?hl= or ?lang=, then fallback to navigator language
    var isZh = true;
    var urlLang = getQueryParam('hl') || getQueryParam('lang');
    if (urlLang) {
      isZh = urlLang.toLowerCase().indexOf('zh') === 0;
    } else {
      var navLang = navigator.language || navigator.userLanguage || (navigator.languages && navigator.languages[0]) || 'zh';
      isZh = ('' + navLang).toLowerCase().indexOf('zh') === 0;
    }

    var currentI18n = isZh ? i18n.zh : i18n.en;
    if (!isZh) {
      if (document.documentElement) document.documentElement.setAttribute('lang', 'en');
      document.title = currentI18n.title;

      var elH1 = document.getElementById('page-title');
      if (elH1) setText(elH1, currentI18n.h1);

      var elPrefix = document.getElementById('desc-prefix');
      if (elPrefix) setText(elPrefix, currentI18n.descPrefix);

      var elSuffix = document.getElementById('desc-suffix');
      if (elSuffix) setText(elSuffix, currentI18n.descSuffix);

      var elNote = document.getElementById('desc-note');
      if (elNote) setText(elNote, currentI18n.descNote);

      var elSolHead = document.getElementById('solutions-heading');
      if (elSolHead) setText(elSolHead, currentI18n.solutionsHeading);

      for (var s = 0; s < 4; s++) {
        var elSol = document.getElementById('solution-' + (s + 1));
        if (elSol) elSol.innerHTML = currentI18n.solutions[s];
      }

      var elHome = document.getElementById('home-button');
      if (elHome) setText(elHome, currentI18n.homeBtn);

      var elSnackPrefix = document.getElementById('snackbar-prefix');
      if (elSnackPrefix) setText(elSnackPrefix, currentI18n.snackbarPrefix);

      var elSnackAction = document.getElementById('next-fact');
      if (elSnackAction) setText(elSnackAction, currentI18n.snackbarAction);
    }

    var activeFacts = isZh ? jeffFacts : jeffFacts_en;

    var snackbar = document.getElementById('jeff-snackbar');
    var factContent = document.getElementById('jeff-fact-content');
    var nextBtn = document.getElementById('next-fact');
    var robotTrigger = document.getElementById('robot-trigger');
    var robotIcon = robotTrigger ? robotTrigger.querySelector('.robot-icon') : null;
    var snackbarTimer = null;
    var isHovered = false;
    var lastFactIndex = -1;

    function getRandomFact() {
      if (!activeFacts || activeFacts.length === 0) return '';
      if (activeFacts.length === 1) return activeFacts[0];
      var index;
      do {
        index = Math.floor(Math.random() * activeFacts.length);
      } while (index === lastFactIndex);
      lastFactIndex = index;
      return activeFacts[index];
    }

    function hideSnackbar() {
      if (snackbarTimer) {
        clearTimeout(snackbarTimer);
        snackbarTimer = null;
      }
      removeClass(snackbar, 'show');
    }

    function resetAutoDismissTimer(duration) {
      if (snackbarTimer) {
        clearTimeout(snackbarTimer);
        snackbarTimer = null;
      }
      if (isHovered) return;
      snackbarTimer = setTimeout(function() {
        hideSnackbar();
      }, duration || 8000);
    }

    function showFact() {
      if (!snackbar || !factContent) return;
      var newFact = getRandomFact();
      var isAlreadyShown = hasClass(snackbar, 'show');

      // 立即更新文本，无动画延迟
      setText(factContent, newFact);
      if (!isAlreadyShown) {
        addClass(snackbar, 'show');
      }

      resetAutoDismissTimer(8000);
    }

    if (nextBtn) {
      addEvent(nextBtn, 'click', function(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        showFact();
      });
    }

    // 鼠标悬停与焦点感知：暂停/恢复自动隐藏
    if (snackbar) {
      addEvent(snackbar, 'mouseenter', function() {
        isHovered = true;
        if (snackbarTimer) {
          clearTimeout(snackbarTimer);
          snackbarTimer = null;
        }
      });
      addEvent(snackbar, 'mouseleave', function() {
        isHovered = false;
        if (hasClass(snackbar, 'show')) {
          resetAutoDismissTimer(4000);
        }
      });
      addEvent(snackbar, 'focusin', function() {
        isHovered = true;
        if (snackbarTimer) {
          clearTimeout(snackbarTimer);
          snackbarTimer = null;
        }
      });
      addEvent(snackbar, 'focusout', function() {
        isHovered = false;
        if (hasClass(snackbar, 'show')) {
          resetAutoDismissTimer(4000);
        }
      });
    }

    function triggerEasterEgg() {
      if (robotIcon) {
        addClass(robotIcon, 'easter-egg-bounce');
        setTimeout(function() {
          removeClass(robotIcon, 'easter-egg-bounce');
        }, 450);
      }
      showFact();
    }

    var clickCount = 0;
    var clickTimer = null;
    if (robotTrigger) {
      addEvent(robotTrigger, 'click', function() {
        clickCount++;
        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(function() { clickCount = 0; }, 800);
        
        if (clickCount >= 2) {
          triggerEasterEgg();
          clickCount = 0;
        }
      });

      addEvent(robotTrigger, 'dblclick', function() {
        triggerEasterEgg();
        clickCount = 0;
      });
    }

    addEvent(window, 'keydown', function(e) {
      e = e || window.event;
      var target = e.target || e.srcElement;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
        return;
      }
      var key = '';
      if (e.key) key = e.key.toLowerCase();
      else if (e.keyCode) {
        if (e.keyCode === 70) key = 'f';
        else if (e.keyCode === 74) key = 'j';
        else if (e.keyCode === 69) key = 'e';
      }
      
      if (key === 'f' || key === 'j' || key === 'e') {
        triggerEasterEgg();
      }
    });

    // Top Peeking Easter Egg Logic
    var topPeekEl = document.getElementById('top-peek');
    var peekAvatar = document.getElementById('peek-avatar');
    var peekAndroid = document.getElementById('peek-android');
    var isPeekShown = false;

    function showTopPeek() {
      if (isPeekShown || !topPeekEl) return;
      // 随机选择展示头像或 Android 机器人
      var chooseAvatar = Math.random() < 0.5;
      if (chooseAvatar) {
        addClass(topPeekEl, 'mode-avatar');
        removeClass(topPeekEl, 'mode-android');
        if (peekAvatar) addClass(peekAvatar, 'is-active');
        if (peekAndroid) removeClass(peekAndroid, 'is-active');
      } else {
        addClass(topPeekEl, 'mode-android');
        removeClass(topPeekEl, 'mode-avatar');
        if (peekAvatar) removeClass(peekAvatar, 'is-active');
        if (peekAndroid) addClass(peekAndroid, 'is-active');
      }
      addClass(topPeekEl, 'peek-show');
      isPeekShown = true;
    }

    function hideTopPeek() {
      if (!isPeekShown || !topPeekEl) return;
      removeClass(topPeekEl, 'peek-show');
      isPeekShown = false;
    }

    addEvent(document, 'mousemove', function(e) {
      e = e || window.event;
      var clientY = e.clientY;
      if (typeof clientY === 'number') {
        if (clientY <= 60) {
          showTopPeek();
        } else if (clientY > 80) {
          hideTopPeek();
        }
      }
    });

    addEvent(document, 'mouseleave', function() {
      hideTopPeek();
    });

    addEvent(window, 'mouseout', function(e) {
      e = e || window.event;
      var from = e.relatedTarget || e.toElement;
      if (!from || from.nodeName === 'HTML') {
        hideTopPeek();
      }
    });
    })();
  </script>
