<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh" data-theme="light" class="icons-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">
        (function() {
            var isLegacy = false;
            try {
                if (!window.addEventListener || !document.querySelector || !window.localStorage) {
                    isLegacy = true;
                }
                eval('var f = function(x) { return x; }; var g = (x) => x;');
            } catch (e) {
                isLegacy = true;
            }
            if (isLegacy) {
                window.location.href = 'k/index.html';
            }
        })();
    </script>
    <!--[if lt IE 9]>
    <script type="text/javascript">
        window.location.href = 'k/index.html';
    </script>
    <![endif]-->
    {{meta}}

    <!-- Google tag (gtag.js) -->
    {{analytics}}

    <!-- Material Symbols & Fonts -->
    <link href="https://fonts.googleapis.cn/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

    <!-- Hide icon-font ligature text until the icon font is ready -->
    <script>
        (function () {
            var root = document.documentElement;
            var done = false;
            function reveal() {
                if (done) return;
                done = true;
                root.classList.remove('icons-loading');
                root.classList.add('icons-ready');
            }
            if (!document.fonts || !document.fonts.check || typeof document.fonts.forEach !== 'function') {
                reveal();
                return;
            }
            var started = Date.now();
            (function poll() {
                var hasFace = false;
                document.fonts.forEach(function (face) {
                    if (face.family && face.family.indexOf('Material Symbols Outlined') !== -1) hasFace = true;
                });
                if (hasFace && document.fonts.check('24px "Material Symbols Outlined"')) {
                    reveal();
                } else if (Date.now() - started > 12000) {
                    reveal();
                } else {
                    window.setTimeout(poll, 100);
                }
            })();
        })();
    </script>
    <noscript>
        <style>html.icons-loading .material-symbols-outlined { visibility: visible; }</style>
    </noscript>

    <!-- Theme/language bootstrap (runs before CSS to avoid a flash) -->
    <script src="assets/js/boot.js?v={{version}}"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/main.css?v={{version}}">
    <link rel="stylesheet" href="assets/css/snow.css">
    <link rel="stylesheet" href="assets/css/status.css">

    <!-- Scripts -->
    <script src="assets/js/snow.js"></script>
    <script src="assets/js/home-i18n.js?v={{version}}" defer></script>
    <script src="assets/js/main.js?v={{version}}" defer></script>
</head>
<body>
    <noscript>
        {{ui.noscript}}
    </noscript>

    <button class="fab" id="scroll-top" title="{{ui.scrollTop}}">
        <span class="material-symbols-outlined">arrow_upward</span>
    </button>

    <header>
        <a href="#" class="logo">
            <span class="material-symbols-outlined">{{header.logoIcon}}</span>
            <span data-i18n="welcome_title">{{header.logoText}}</span>
        </a>
        <div class="controls">
            <button class="btn-icon" id="lang-toggle" type="button" title="{{ui.languageToggle}}" aria-label="{{ui.languageToggle}}">
                <span class="material-symbols-outlined">translate</span>
            </button>
            <button class="btn-icon" id="theme-toggle" type="button" title="{{ui.themeToggle}}" aria-label="{{ui.themeToggle}}">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </div>
    </header>

    <div class="announce-top" id="announce-top" aria-live="polite"></div>

    <main class="container">
        {{hero}}

        <section class="announce-section" id="announce-list" aria-live="polite"></section>

        {{updates}}

        {{featured}}

        {{allProjects}}

        {{support}}

        {{academic}}

        {{contact}}

        {{stats}}
    </main>

    {{footer}}

    {{terminal}}
</body>

</html>
